# Builds the plugin and attaches the ready-to-install zip to a GitHub release.
#
# Usage: GitHub -> Releases -> "Create a new release" -> choose a tag (e.g. v1.0.0,
# must match "version" in package.json) -> Publish. A minute later the release
# contains camunda-modeler-pdf-export-v1.0.0.zip next to the source archives.

name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci

      - run: npm run package

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/*.zip --clobber
